<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Combo Web Toy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            background-size: 200% 200%;
            animation: gradientBG 10s ease infinite;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden; 
            position: relative; 
            transition: background 0.5s ease;
            touch-action: none;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #000000 0%, #111111 50%, #1a1a1a 100%);
            background-size: 200% 200%;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: clamp(10px, 2vw, 20px) clamp(15px, 3vw, 30px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: none; 
            user-select: none;
            z-index: 10;
        }

        h1 { 
            margin: 0; 
            font-size: clamp(1.1rem, 2.5vw, 1.8rem); 
            font-weight: 600; 
            white-space: nowrap;
        }

        #combo-text {
            font-size: clamp(0.85rem, 1.8vw, 1.2rem);
            color: #ffd700; 
            margin-top: 5px;
            font-weight: bold;
            display: none; 
            white-space: nowrap;
        }

        button {
            user-select: none; 
            -webkit-user-select: none;
        }

        #main-btn {
            position: absolute; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: bold;
            padding: clamp(10px, 2vh, 16px) clamp(20px, 3vw, 32px);
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #ff4757; 
            color: white;
            box-shadow: 0px 4px 15px rgba(255, 71, 87, 0.5);
            transition: background 0.1s, box-shadow 0.2s ease-out; 
            z-index: 5;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .bottom-btn {
            padding: clamp(8px, 1.5vh, 12px) clamp(12px, 2vw, 20px);
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            font-weight: 600;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            transition: background 0.2s;
        }

        .bottom-btn:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    
    <div class="ui-panel">
        <h1>SCORE: <span id="score-display">0</span></h1>
        <div id="combo-text">COMBO: x<span id="combo-display">0</span>!</div>
    </div>

    <button id="main-btn">CATCH ME</button>

    <div class="controls">
        <button id="theme-btn" class="bottom-btn">DARK MODE</button>
        <button id="reset-btn" class="bottom-btn">RESET</button>
    </div>

    <script>
        let score = 0;
        let comboCount = 0;
        let comboLimit = Math.floor(Math.random() * 5) + 2; 

        let scoreText = document.getElementById("score-display");
        let comboUI = document.getElementById("combo-text");
        let comboDisplay = document.getElementById("combo-display");
        let mainBtn = document.getElementById("main-btn");

        function teleportButton() {
            let randomX = Math.floor(Math.random() * 50) + 25; 
            let randomY = Math.floor(Math.random() * 50) + 25; 
            mainBtn.style.top = randomY + "vh";
            mainBtn.style.left = randomX + "vw";
        }

        function attemptDodge(event) {
            if (comboCount === 0) {
                let chance = Math.random(); 
                if (chance < 0.80) { 
                    teleportButton();
                    if (event.type === "touchstart") {
                        event.preventDefault();
                    }
                }
            }
        }

        mainBtn.onmouseover = attemptDodge;
        mainBtn.ontouchstart = attemptDodge;

        mainBtn.onclick = function() {
            score++;
            scoreText.innerText = score;
            
            comboCount++;
            comboUI.style.display = "block"; 
            comboDisplay.innerText = comboCount;
            mainBtn.style.background = "#2ed573"; 
            mainBtn.innerText = "HIT!"; 

            let glowSize = 15 + (comboCount * 12);
            let glowBrightness = Math.min(0.4 + (comboCount * 0.15), 1.0); 
            mainBtn.style.boxShadow = `0px 0px ${glowSize}px rgba(46, 213, 115, ${glowBrightness})`;

            if (comboCount >= comboLimit) {
                comboCount = 0; 
                comboLimit = Math.floor(Math.random() * 5) + 2; 
                
                comboUI.style.display = "none"; 
                mainBtn.style.background = "#ff4757"; 
                mainBtn.innerText = "CATCH ME";
                mainBtn.style.boxShadow = "0px 4px 15px rgba(255, 71, 87, 0.5)";
                
                teleportButton(); 
            }
        };

        document.getElementById("reset-btn").onclick = function() {
            score = 0;
            comboCount = 0;
            comboLimit = Math.floor(Math.random() * 5) + 2;
            
            scoreText.innerText = score;
            comboUI.style.display = "none";
            
            mainBtn.style.background = "#ff4757";
            mainBtn.innerText = "CATCH ME";
            mainBtn.style.top = "50%";
            mainBtn.style.left = "50%";
            mainBtn.style.boxShadow = "0px 4px 15px rgba(255, 71, 87, 0.5)";
        };

        document.getElementById("theme-btn").onclick = function() {
            document.body.classList.toggle("dark-mode");
        };
    </script>
</body>
</html>
